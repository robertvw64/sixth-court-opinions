name: Fetch Sixth Court opinions

on:
  schedule:
    # Weekdays at 23:30 UTC (6:30 pm Central daylight / 5:30 pm standard time)
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Release date MM/DD/YYYY (leave blank for all new dates)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download new orders and opinions
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python fetch_opinions.py --date "${{ github.event.inputs.date }}"
          else
            python fetch_opinions.py
          fi
      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opinions
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add Sixth Court orders and opinions $(date -u +%Y-%m-%d)"
            git push
          fi
