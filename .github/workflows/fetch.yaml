name: Fetch Sixth Court opinions

on:
  schedule:
    # Weekdays at 16:00 UTC (11:00 am Central daylight / 10:00 am standard time)
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Release date MM/DD/YYYY (leave blank for all new dates)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      DATE_INPUT: ${{ github.event.inputs.date }}
      # A step's "if" can't read secrets, so expose whether the key is set.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download new orders and opinions
        run: |
          if [ -n "$DATE_INPUT" ]; then
            python fetch_opinions.py --date "$DATE_INPUT"
          else
            python fetch_opinions.py
          fi

      - name: Summarize new opinions with Claude
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        timeout-minutes: 120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_SKILL_ID: ${{ secrets.CLAUDE_SKILL_ID }}
          CLAUDE_SKILL_VERSION: skver_01Jz8RHBicgAKSLeXJc1seuh
          CLAUDE_MODEL: claude-sonnet-5-5
        run: |
          if [ -n "$DATE_INPUT" ]; then
            python summarize_opinions.py --date "$DATE_INPUT"
          else
            python summarize_opinions.py
          fi

      # The remaining steps also run after a failed step, so fetched PDFs and
      # finished summaries are kept. The run still shows as failed.
      - name: Generate File Index for Browser
        if: ${{ !cancelled() }}
        run: |
          echo "<html><head><title>Downloaded Court Files</title></head><body>" > index.html
          echo "<h1>Court Documents Index</h1><ul>" >> index.html

          while IFS= read -r file; do
            rel_path="${file#./}"
            label="${rel_path#opinions/}"
            echo "<li><a href=\"${rel_path}\">${label}</a></li>" >> index.html
          done < <(find opinions -type f -not -path '*/summaries/*' | sort)

          echo "</ul></body></html>" >> index.html

      - name: Commit and Push Changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opinions index.html
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Automated update: Court files and summaries $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
