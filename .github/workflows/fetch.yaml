name: Fetch Sixth Court opinions

on:
  schedule:
    # Weekdays at 23:30 UTC (6:30 pm Central daylight / 5:30 pm standard time)
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Release date MM/DD/YYYY (leave blank for all new dates)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download new orders and opinions
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python fetch_opinions.py --date "${{ github.event.inputs.date }}"
          else
            python fetch_opinions.py
          fi
      - name: Generate File Index for Browser
        run: |
          echo "<html><head><title>Downloaded Court Files</title></head><body>" > index.html
          echo "<h1>Court Documents Index</h1><ul>" >> index.html

          while IFS= read -r file; do
            rel_path="${file#./}"
            label="${rel_path#opinions/}"
            echo "<li><a href=\"${rel_path}\">${label}</a></li>" >> index.html
          done < <(find opinions -type f | sort)

          echo "</ul></body></html>" >> index.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add downloads/ index.html
          git commit -m "Automated update: Court files and browser index" || echo "No changes to commit"
          git push

      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opinions
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add Sixth Court orders and opinions $(date -u +%Y-%m-%d)"
            git push
          fi
